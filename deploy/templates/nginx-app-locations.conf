    root __APP_ROOT__/current/artifacts/school-management/dist/public;
    index index.html;

    # Logo uploads are capped at 5 MB by the API; JSON bodies at 2 MB.
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # The API. Host and X-Forwarded-Proto must pass through: the API's same-origin check and secure cookies use them.
    location /api/ {
        proxy_pass http://rejista_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Fingerprinted build files never change: cache them for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/rejista-headers.conf;
    }

    # The web app. Unknown paths load index.html so the app's own router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/rejista-headers.conf;
    }
