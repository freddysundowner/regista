# Rejista, plain HTTP. Used before an SSL certificate exists (and with --no-ssl). install.sh replaces it with the
# HTTPS version once the certificate is issued.
upstream rejista_api {
    server 127.0.0.1:__API_PORT__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt domain checks
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    __APP_LOCATIONS__
}
