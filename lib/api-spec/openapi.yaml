        photoUrl: { $ref: "#/components/schemas/AssetReference" }
        transportRouteId: { type: ["string", "null"], maxLength: 100 }
        admissionNo: { type: string, minLength: 1, maxLength: 60 }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        middleName: { type: ["string", "null"], maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        gender: { type: ["string", "null"], enum: [male, female, other, null] }
        dateOfBirth: { type: ["string", "null"], format: date }
        gradeId: { type: ["string", "null"], format: uuid }
        streamId: { type: ["string", "null"], format: uuid }
        status: { $ref: "#/components/schemas/StudentStatus" }
        boardingStatus: { $ref: "#/components/schemas/BoardingStatus" }
        admissionDate: { type: ["string", "null"], format: date }
        upi: { type: ["string", "null"], maxLength: 100 }
    StudentImportRow:
      type: object
      properties:
        admissionNo: { type: string }
        firstName: { type: string }
        middleName: { type: ["string", "null"] }
        lastName: { type: string }
        gender: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"] }
        gradeName: { type: ["string", "null"] }
        streamName: { type: ["string", "null"] }
        boardingStatus: { type: ["string", "null"] }
        admissionDate: { type: ["string", "null"] }
        guardianName: { type: ["string", "null"] }
        guardianPhone: { type: ["string", "null"] }
        guardianRelationship: { type: ["string", "null"] }
      required: [admissionNo, firstName, lastName]
    StudentImportInput:
      type: object
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/StudentImportRow" }
      required: [rows]
    StudentImportPreviewRow:
      type: object
      properties:
        rowNumber: { type: integer }
        admissionNo: { type: string }
        studentName: { type: string }
        guardianPhone: { type: ["string", "null"] }
        status: { type: string, enum: [valid, error, duplicate] }
        errors:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
      required: [rowNumber, admissionNo, studentName, status, errors, warnings]
    StudentImportPreview:
      type: object
      properties:
        totalRows: { type: integer }
        validRows: { type: integer }
        errorRows: { type: integer }
        duplicateRows: { type: integer }
        siblingMatches: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/StudentImportPreviewRow" }
      required: [totalRows, validRows, errorRows, duplicateRows, siblingMatches, rows]
    StudentImportResult:
      type: object
      properties:
        createdStudents: { type: integer }
        linkedGuardians: { type: integer }
        siblingGroupsCreated: { type: integer }
        skippedRows: { type: integer }
      required: [createdStudents, linkedGuardians, siblingGroupsCreated, skippedRows]
    AuditLog:
      type: object
      properties:
        before: { type: ["object", "null"], additionalProperties: true }
        after: { type: ["object", "null"], additionalProperties: true }
        ip: { type: ["string", "null"] }
        userAgent: { type: ["string", "null"] }
        id: { type: string, format: uuid }
        userName: { type: ["string", "null"] }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, action, entityType, createdAt]
    AssetReference:
      type: ["string", "null"]
      maxLength: 500
      pattern: "^/api/storage/files/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      description: Private App Storage objectPath, never an external URL; server verifies same-school ownership.
    SchoolSettings:
      type: object
      additionalProperties: false
      properties:
        highValuePaymentThreshold:
          type: string
          pattern: '^\d{1,12}(\.\d{1,2})?$'
          description: Positive KES threshold, default 100000. Invalid or nonpositive provider configuration fails closed.
        autoPostThreshold: { type: integer, minimum: 0, maximum: 150 }
        fuzzyNameThreshold: { type: number, minimum: 0.8, maximum: 1 }
        matchingScores:
          type: object
          additionalProperties: false
          properties:
            exact: { type: integer, minimum: 0, maximum: 150 }
            normalized: { type: integer, minimum: 0, maximum: 150 }
            alias: { type: integer, minimum: 0, maximum: 150 }
            guardian: { type: integer, minimum: 0, maximum: 150 }
            name: { type: integer, minimum: 0, maximum: 150 }
            typo: { type: integer, minimum: 0, maximum: 150 }
            bonus: { type: integer, minimum: 0, maximum: 30 }
            inactive: { type: integer, minimum: 0, maximum: 150 }
        autoApprovePlanLimit: { type: string, pattern: '^\d{1,12}(\.\d{1,2})?$' }
        messageTemplates:
          type: object
          additionalProperties:
            type: object
            properties:
              transport: { type: string, enum: [template, text] }
              name: { type: string }
              language: { type: string }
              components: { type: array, items: { type: object, additionalProperties: true } }
        knecColumns:
          type: array
          items: { type: string, enum: [admissionNo, upi, studentName, learningArea, percent, level, term] }
        chronicAbsencePercent: { type: number, minimum: 1, maximum: 100 }
        siblingSplitRule: { type: string, enum: [ask_parent, proportional_to_balance, oldest_arrears_first] }
        siblingFallbackRule: { type: string, enum: [proportional_to_balance, oldest_arrears_first, leave_in_queue] }
        siblingReplyHours: { type: integer, minimum: 1, maximum: 168 }
        reminderDays:
          type: array
          maxItems: 20
          items: { type: integer, minimum: -365, maximum: 365 }
        defaultAfterMissedInstallments: { type: integer, minimum: 1, maximum: 24 }
        absenceAlertsEnabled: { type: boolean }
        statusDigest:
          type: string
          enum: [off, weekly, monthly]
          description: How often school administrators get a status message on their phone. Weekly when not set.
        statusDigestChannel:
          type: string
          enum: [sms, whatsapp]
          description: SMS when not set. WhatsApp needs an approved template named school_digest.
        absenceAlertTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        requireSecondApproval:
          type: boolean
          description: When true (the default), discounts, refunds, reversals, bounced cheques and fee changes after billing wait for a second person. When false they apply as soon as they are saved, and are still audited.
        feeStructureTemplates:
          type: array
          maxItems: 20
          description: Saved fee structure printouts. Each keeps its layout and what it prints; fees always come from the latest approved amounts.
          items: { $ref: "#/components/schemas/FeeStructureTemplate" }
      description: Optional per-school settings; PATCH replaces settings, not merges. Academic term dates are maintained through the terms API.
    FeeStructureTemplate:
      type: object
      additionalProperties: false
      description: A saved fee structure printout. Every layout field is optional; missing ones use the defaults.
      properties:
        id: { type: string, minLength: 1, maxLength: 40 }
        name: { type: string, maxLength: 80 }
        grade: { type: string, maxLength: 40, description: A grade id, or "all" for one page per grade. }
        period: { type: string, enum: [current, year], description: The current term, or the whole school year. }
        who: { type: string, enum: [both, day, boarder] }
        title: { type: string, maxLength: 120 }
        subtitle: { type: string, maxLength: 200, description: Motto or a line under the school name. }
        showLogo: { type: boolean }
        showContacts: { type: boolean }
        showYearTotal: { type: boolean }
        showExtras: { type: boolean }
        showPayment: { type: boolean }
        showSignatures: { type: boolean }
        payment: { type: string, maxLength: 2000, description: Paybill, bank accounts and how to pay. }
        extras:
          type: array
          maxItems: 30
          description: Optional charges, such as transport or lunch, with the amount or rule written as the school wants it shown.
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              amount: { type: string, maxLength: 120 }
        sections:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [heading, body]
            properties:
              heading: { type: string, maxLength: 120 }
              body: { type: string, maxLength: 4000 }
        signatories:
          type: array
          maxItems: 4
          items: { type: string, minLength: 1, maxLength: 60 }
        footer: { type: string, maxLength: 400 }
    PlatformSchoolUpdate:
      type: object
      additionalProperties: false
      required: [reason, confirmation]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        confirmation: { type: string, enum: [CONFIRM] }
        name: { type: string, minLength: 2, maxLength: 180 }
        address: { type: ["string", "null"], maxLength: 250 }
        phone: { type: ["string", "null"], maxLength: 20 }
        email: { type: ["string", "null"], format: email }
        county: { type: ["string", "null"], maxLength: 100 }
        type: { $ref: "#/components/schemas/SchoolType" }
        status: { type: string, enum: [active, suspended] }
        subscriptionPlan: { type: string, minLength: 1, maxLength: 80 }
        subscriptionStatus: { type: string, enum: [trial, active, expired, cancelled] }
        subscriptionStartDate: { type: ["string", "null"], format: date }
        subscriptionEndDate: { type: ["string", "null"], format: date }
    BillingAmount:
      type: string
      pattern: '^[0-9]{1,10}(\.[0-9]{1,2})?$'
    PlatformInvoiceInput:
      type: object
      additionalProperties: false
      required: [requestId, description, amount, issuedOn, dueOn]
      properties:
        requestId: { type: string, format: uuid }
        description: { type: string, minLength: 3, maxLength: 250 }
        amount: { $ref: "#/components/schemas/BillingAmount" }
        issuedOn: { type: string, format: date }
        dueOn: { type: string, format: date }
        periodStart: { type: ["string", "null"], format: date }
        periodEnd: { type: ["string", "null"], format: date }
    PlatformPaymentInput:
      type: object
      additionalProperties: false
      required: [requestId, amount, paidOn, method, reference]
      properties:
        requestId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/BillingAmount" }
        paidOn: { type: string, format: date }
        method: { type: string, enum: [bank, mpesa, cash, other] }
        reference: { type: string, minLength: 2, maxLength: 120 }
    PlatformBillingCorrection:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    PlatformBillingPayment:
      type: object
      required: [id, amount, paidOn, method, reference, reversedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        amount: { type: string }
        paidOn: { type: string, format: date }
        method: { type: string }
        reference: { type: string }
        reversedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    PlatformInvoice:
      type: object
      required: [id, number, schoolId, description, amount, issuedOn, dueOn, periodStart, periodEnd, status, paid, balance, payments, createdAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        schoolId: { type: string, format: uuid }
        description: { type: string }
        amount: { type: string }
        issuedOn: { type: string, format: date }
        dueOn: { type: string, format: date }
        periodStart: { type: ["string", "null"], format: date }
        periodEnd: { type: ["string", "null"], format: date }
        status: { type: string, enum: [unpaid, partial, paid, overdue, void] }
        paid: { type: string }
        balance: { type: string }
        payments: { type: array, items: { $ref: "#/components/schemas/PlatformBillingPayment" } }
        createdAt: { type: string, format: date-time }
    PlatformBilling:
      type: object
      required: [currency, totalBilled, totalPaid, outstanding, overdue, invoices]
      properties:
        currency: { type: string, enum: [KES] }
        totalBilled: { type: string }
        totalPaid: { type: string }
        outstanding: { type: string }
        overdue: { type: string }
        invoices: { type: array, items: { $ref: "#/components/schemas/PlatformInvoice" } }
    SubscriptionInvoiceRow:
      allOf:
        - { $ref: "#/components/schemas/PlatformInvoice" }
        - type: object
          required: [schoolName, schoolCode]
          properties:
            schoolName: { type: string }
            schoolCode: { type: string }
    SubscriptionPaymentRow:
      allOf:
        - { $ref: "#/components/schemas/PlatformBillingPayment" }
        - type: object
          required: [schoolId, schoolName, schoolCode, invoiceId, invoiceNumber, description]
          properties:
            schoolId: { type: string, format: uuid }
            schoolName: { type: string }
            schoolCode: { type: string }
            invoiceId: { type: string, format: uuid }
            invoiceNumber: { type: string }
            description: { type: string }
    PlatformSubscriptions:
      type: object
      required: [invoices, payments, invoiceTotal, paymentTotal, pageSize]
      properties:
        invoices: { type: array, items: { $ref: "#/components/schemas/SubscriptionInvoiceRow" } }
        payments: { type: array, items: { $ref: "#/components/schemas/SubscriptionPaymentRow" } }
        invoiceTotal: { type: integer }
        paymentTotal: { type: integer }
        pageSize: { type: integer }
    WhatsappConnectionCheck:
      type: object
      required: [status, checkedAt]
      properties:
        status: { type: string }
        displayPhoneNumber: { type: string }
        checkedAt: { type: string, format: date-time }
    PasswordChangeInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 6, maxLength: 128 }
    TeacherAssignmentInput:
      type: object
      required: [userId, streamId]
      properties:
        userId: { type: string, format: uuid }
        streamId: { type: string, format: uuid }
    TeacherAssignment:
      type: object
      required: [id, userId, streamId, userName, streamName, gradeName]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        streamId: { type: string, format: uuid }
        userName: { type: string }
        streamName: { type: string }
        gradeName: { type: string }
    PrivacyConfirmation:
      type: object
      required: [confirmation]
      properties:
        confirmation: { type: string, enum: [ANONYMIZE] }
    GuardianExport:
      type: object
      required: [guardian, links, exportedAt]
      properties:
        guardian: { $ref: "#/components/schemas/Guardian" }
        exportedAt: { type: string, format: date-time }
        links:
          type: array
          items: { $ref: "#/components/schemas/GuardianExportLink" }
    GuardianExportLink:
      type: object
      required: [studentId, relationship, isPrimary, receivesNotifications]
      properties:
        studentId: { type: string, format: uuid }
        relationship: { type: string }
        isPrimary: { type: boolean }
        receivesNotifications: { type: boolean }
    PromotionInput:
      type: object
      required: [sourceYearId, targetYearId, sourceStreamId, action]
      properties:
        sourceYearId: { type: string, format: uuid }
        targetYearId: { type: string, format: uuid }
        sourceStreamId: { type: string, format: uuid }
        targetStreamId: { type: ["string", "null"], format: uuid }
        action: { type: string, enum: [promote, graduate] }
    PromotionConfirmation:
      type: object
      required: [previewToken, confirmation]
      properties:
        previewToken: { type: string, maxLength: 10000 }
        confirmation: { type: string, enum: [PROMOTE] }
    PromotionPreview:
      type: object
      required: [previewToken, students, count]
      properties:
        previewToken: { type: string }
        count: { type: integer }
        students:
          type: array
          items: { $ref: "#/components/schemas/FamilyStudent" }
    PromotionResult:
      type: object
      required: [updatedStudents]
      properties:
        updatedStudents: { type: integer }
    FileUploadInput:
      type: object
      required: [name, size, contentType, purpose, entityId]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        size: { type: integer, minimum: 1, maximum: 5242880 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        purpose: { type: string, enum: [school_logo, student_photo, finance_document], description: 'finance_document: a receipt or invoice scan; entityId is the school' }
        entityId: { type: string, format: uuid }
    FileUpload:
      type: object
      required: [id, uploadUrl, objectPath]
      properties:
        id: { type: string, format: uuid }
        uploadUrl: { type: string }
        objectPath: { type: string }
    StoredFileReference:
      type: object
      required: [id, objectPath]
      properties:
        id: { type: string, format: uuid }
        objectPath: { type: string }

