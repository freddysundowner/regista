        phone: { type: ["string", "null"], minLength: 9, maxLength: 20 }
        isActive: { type: boolean }
        reason: { type: string, minLength: 3, maxLength: 500 }
        confirmation: { type: string, enum: [CONFIRM] }
      required: [reason, confirmation]
