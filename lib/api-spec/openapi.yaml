      type: object
      required: [dismissed, steps]
      properties:
        dismissed: { type: boolean }
        steps:
          type: array
          items:
            type: object
            required: [id, done, skipped, optional]
            properties:
              id: { $ref: '#/components/schemas/OnboardingStepId' }
              done: { type: boolean }
              skipped: { type: boolean }
              optional: { type: boolean }
    OnboardingInput:
      type: object
      properties:
        dismissed: { type: boolean }
        skip: { $ref: '#/components/schemas/OnboardingStepId' }
        unskip: { $ref: '#/components/schemas/OnboardingStepId' }
