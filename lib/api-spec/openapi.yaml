openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: School Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: setup
    description: First-run school setup
  - name: auth
    description: User authentication
  - name: dashboard
    description: School overview
  - name: school
    description: School settings
  - name: users
    description: Staff accounts
  - name: academics
    description: Academic years, terms, grades, and streams
  - name: students
    description: Student records
  - name: guardians
    description: Guardian and family records
  - name: imports
    description: Student bulk import
  - name: audit
    description: Audit history
paths:
  /platform/whatsapp:
    get:
      operationId: getPlatformWhatsappSetup
      responses: &waResponses
        "200":
          description: Connection setup state without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsappSetupState" }
  /whatsapp:
    get:
      operationId: getSchoolWhatsappSetup
      responses: *waResponses
  /platform/whatsapp/key:
    put:
      operationId: saveLeadsIntelPlatformKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadsIntelKeyInput" }
      responses: *waResponses
  /platform/whatsapp/start:
    post:
      operationId: startPlatformWhatsappSetup
      requestBody: &waStart
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatsappStartInput" }
      responses: *waResponses
  /whatsapp/start:
    post:
      operationId: startSchoolWhatsappSetup
      requestBody: *waStart
      responses: *waResponses
  /platform/whatsapp/recover:
    post:
      operationId: recoverPlatformWhatsapp
      requestBody: &waRecover
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatsappRecoverInput" }
      responses: *waResponses
  /whatsapp/recover:
    post:
      operationId: recoverSchoolWhatsapp
      requestBody: *waRecover
      responses: *waResponses
  /platform/whatsapp/refresh:
    post:
      operationId: refreshPlatformWhatsappSetup
      responses: *waResponses
  /whatsapp/refresh:
    post:
      operationId: refreshSchoolWhatsappSetup
      responses: *waResponses
  /email/settings:
    get:
      operationId: getSchoolEmailSettings
      responses:
        "200":
          description: This school's own Brevo configuration, without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformEmailSettings" }
    put:
      operationId: saveSchoolEmailSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformEmailSettingsInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformEmailSettings" }
  /email/settings/test:
    post:
      operationId: sendSchoolTestEmail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformEmailTestInput" }
      responses:
        "200":
          description: Accepted by Brevo, not delivery confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailQueuedResult" }
  /platform/email-recipients:
    get:
      operationId: listPlatformEmailRecipients
      responses:
        "200":
          description: School administrators available to platform owner
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EmailAudienceRecipient" }
  /email-recipients:
    get:
      operationId: listSchoolEmailRecipients
      responses:
        "200":
          description: Staff and guardians of the authenticated school
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EmailAudienceRecipient" }
  /platform/emails:
    get:
      operationId: listPlatformEmailCampaigns
      responses:
        "200":
          description: Latest platform emails
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EmailCampaignSummary" }
    post:
      operationId: createPlatformEmailCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailCampaignCreateInput" }
      responses:
        "200":
          description: Queued for sending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailQueuedResult" }
  /emails:
    get:
      operationId: listSchoolEmailCampaigns
      responses:
        "200":
          description: Latest emails for this school only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EmailCampaignSummary" }
    post:
      operationId: createSchoolEmailCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailCampaignCreateInput" }
      responses:
        "200":
          description: Queued for sending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailQueuedResult" }
  /platform/settings/email:
    get:
      operationId: getPlatformEmailSettings
      responses:
        "200":
          description: Platform email settings without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformEmailSettings" }
    put:
      operationId: savePlatformEmailSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformEmailSettingsInput" }
      responses:
        "200":
          description: Email settings saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformEmailSettings" }
  /platform/settings/email/test:
    post:
      operationId: sendPlatformTestEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformEmailTestInput"
      responses:
        "200":
          description: Accepted by Brevo, not a delivery confirmation
          content:
            application/json:
              schema:
                type: object
                required: [message, messageId]
                properties:
                  message: { type: string }
                  messageId: { type: string }
  /platform/messaging/whatsapp/connection:
    get:
      operationId: checkPlatformWhatsappConnection
      responses:
        "200":
          description: Live connection status; does not send a message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsappConnectionCheck" }
  /messaging/settings/whatsapp/connection:
    get:
      operationId: checkSchoolWhatsappConnection
      responses:
        "200":
          description: Live effective connection status; does not send a message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsappConnectionCheck" }
  /platform/subscriptions:
    get:
      operationId: getPlatformSubscriptions
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 150 } }
        - { name: invoicePage, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: paymentPage, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Platform subscription invoices and received payments across schools
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSubscriptions" }
  /integrations/messaging-delivery/events/{token}:
    $ref: './messaging.yaml#/paths/deliveryGateway'
  /platform/messaging:
    $ref: './messaging.yaml#/paths/platform'
  /platform/messaging/{channel}:
    $ref: './messaging.yaml#/paths/platformChannel'
  /messaging/settings:
    $ref: './messaging.yaml#/paths/school'
  /messaging/settings/{channel}:
    $ref: './messaging.yaml#/paths/schoolChannel'
  /platform/licence-plans:
    $ref: './licensing.yaml#/paths/plans'
  /platform/licence-plans/{planId}:
    $ref: './licensing.yaml#/paths/plan'
  /platform/schools/{schoolId}/licensing:
    $ref: './licensing.yaml#/paths/school'
  /platform/schools/{schoolId}/licences:
    $ref: './licensing.yaml#/paths/issue'
  /platform/schools/{schoolId}/licences/{licenceId}/revoke:
    $ref: './licensing.yaml#/paths/revoke'
  /public/pricing:
    $ref: './licensing.yaml#/paths/publicPricing'
  /platform/pricing:
    $ref: './licensing.yaml#/paths/pricing'
  /installation:
    $ref: './licensing.yaml#/paths/installation'
  /installation/licence:
    $ref: './licensing.yaml#/paths/installationLicence'
  /platform/standalone-licences:
    $ref: './licensing.yaml#/paths/standaloneLicences'
  /platform/registration-settings:
    $ref: './licensing.yaml#/paths/registrationSettings'
  /platform/payment-gateways:
    $ref: './licensing.yaml#/paths/gateways'
  /platform/payment-gateways/{provider}:
    $ref: './licensing.yaml#/paths/gateway'
  /platform/licence-keys:
    $ref: './licensing.yaml#/paths/keys'
  /platform/licence-keys/{keyId}/reveal:
    $ref: './licensing.yaml#/paths/keyReveal'
  /platform/licence-keys/{keyId}/revoke:
    $ref: './licensing.yaml#/paths/keyRevoke'
  /school/subscription/orders/{orderId}/checkout:
    $ref: './licensing.yaml#/paths/checkout'
  /school/subscription/checkouts/{checkoutId}:
    $ref: './licensing.yaml#/paths/checkoutStatus'
  /school/subscription/redeem:
    $ref: './licensing.yaml#/paths/redeem'
  /onboarding:
    get:
      operationId: getOnboarding
      responses:
        "200":
          description: Setup-guide progress, worked out from the school's real data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Onboarding' }
    patch:
      operationId: updateOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingInput' }
      responses:
        "200":
          description: Guide preferences saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Onboarding' }
  /school/subscription:
    $ref: './licensing.yaml#/paths/subscription'
  /school/subscription/orders:
    $ref: './licensing.yaml#/paths/orders'
  /school/subscription/orders/{orderId}/cancel:
    $ref: './licensing.yaml#/paths/cancel'
  /platform/schools/{schoolId}/billing:
    get:
      operationId: getPlatformBilling
      parameters:
        - { name: schoolId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Manual platform billing, separate from student fees
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformBilling" }
  /platform/schools/{schoolId}/billing/invoices:
    post:
      operationId: createPlatformInvoice
      parameters:
        - { name: schoolId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformInvoiceInput" }
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformInvoice" }
  /platform/schools/{schoolId}/billing/invoices/{invoiceId}/void:
    post:
      operationId: voidPlatformInvoice
      parameters:
        - { name: schoolId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformBillingCorrection" }
      responses:
        "200":
          description: Invoice voided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformInvoice" }
  /platform/schools/{schoolId}/billing/invoices/{invoiceId}/payments:
    post:
      operationId: recordPlatformPayment
      parameters:
        - { name: schoolId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformPaymentInput" }
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformInvoice" }
  /platform/schools/{schoolId}/billing/invoices/{invoiceId}/payments/{paymentId}/reverse:
    post:
      operationId: reversePlatformPayment
      parameters:
        - { name: schoolId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformBillingCorrection" }
      responses:
        "200":
          description: Payment reversed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformInvoice" }
  /auth/register:
    post:
      operationId: registerSchool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolRegistrationInput" }
      responses:
        "201":
          description: School account created, pending platform approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/email-available:
    post:
      operationId: checkEmailAvailable
      summary: Whether a new account can use this email, asked while signing up so a taken email is caught on the first screen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailAvailabilityInput" }
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailAvailability" }
  /platform/schools/{schoolId}/registration:
    post:
      operationId: reviewSchoolRegistration
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolRegistrationReview" }
      responses:
        "200":
          description: Registration reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/School" }
  /platform/overview:
    get:
      operationId: getPlatformOverview
      responses:
        "200":
          description: Operational platform totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOverview" }
  /platform/schools:
    get:
      operationId: listPlatformSchools
      responses:
        "200":
          description: Schools
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/School" } }
    post:
      operationId: provisionPlatformSchool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformProvisionInput" }
      responses:
        "201":
          description: Provisioned school
          content:
            application/json:
              schema: { $ref: "#/components/schemas/School" }
  /platform/schools/{schoolId}:
    parameters:
      - { name: schoolId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPlatformSchool
      responses:
        "200":
          description: School
          content:
            application/json:
              schema: { $ref: "#/components/schemas/School" }
    patch:
      operationId: editPlatformSchool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformSchoolUpdate" }
      responses:
        "200":
          description: Updated school
          content:
            application/json:
              schema: { $ref: "#/components/schemas/School" }
  /platform/schools/{schoolId}/admins:
    parameters:
      - { name: schoolId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listPlatformAdmins
      responses:
        "200":
          description: Administrators
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      operationId: createPlatformAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformAdminInput" }
      responses:
        "201":
          description: Administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /platform/schools/{schoolId}/admins/{userId}:
    parameters:
      - { name: schoolId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: editPlatformAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformAdminUpdate" }
      responses:
        "200":
          description: Administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /platform/schools/{schoolId}/admins/{userId}/reset-password:
    parameters:
      - { name: schoolId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resetPlatformAdminPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformPasswordInput" }
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformMessage" }
  /platform/audit:
    get:
      operationId: listPlatformAudit
      parameters:
        - { name: schoolId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
        - { name: action, in: query, description: Exact action filter applied across all history, schema: { type: string, minLength: 1, maxLength: 160 } }
        - { name: search, in: query, description: Case-insensitive reason/action/entity substring search across all history, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        "200":
          description: Server-paginated platform audit, newest first with stable ID tie-break. Array shape and default first page preserve overview limit callers.
          headers:
            X-Total-Count:
              description: Matching rows across all pages
              schema: { type: integer }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PlatformAudit" } }
  /platform/tenant-access:
    post:
      operationId: enterTenantAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantAccessInput" }
      responses:
        "200":
          description: Tenant session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /platform/tenant-access/exit:
    post:
      operationId: exitTenantAccess
      responses:
        "200":
          description: Platform session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /integrations/config:
    $ref: './remaining.yaml#/paths/integrations'
  /integrations/kcb/account-notification/{token}:
    $ref: './kcb.yaml#/paths/accountNotification'
  /integrations/kcb/till-notification/{token}:
    $ref: './kcb.yaml#/paths/tillNotification'
  /bank-accounts:
    $ref: './banks.yaml#/paths/accounts'
  /bank-accounts/{id}:
    $ref: './banks.yaml#/paths/account'
  /bank-accounts/{id}/ncba-request:
    $ref: './banks.yaml#/paths/ncbaRequest'
  /bank-accounts/{id}/kcb:
    $ref: './banks.yaml#/paths/kcb'
  /bank-accounts/{id}/kcb-letter.pdf:
    $ref: './banks.yaml#/paths/kcbLetter'
  /bank-accounts/{id}/kcb-key:
    $ref: './banks.yaml#/paths/kcbKey'
  /integrations/ncba/notification/{token}:
    $ref: './banks.yaml#/paths/ncbaNotification'
  /integrations/daraja/register:
    $ref: './remaining.yaml#/paths/registration'
  /payments/incoming:
    $ref: './remaining.yaml#/paths/payments'
  /payments/incoming/{id}:
    get:
      operationId: getIncomingPayment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: School-scoped payment, excluding raw provider payload
          content:
            application/json:
              schema: { $ref: './remaining.yaml#/components/schemas/IncomingPaymentView' }
        "404":
          description: Payment not accessible in this school
  /integrations/message-delivery/events/{token}:
    $ref: './remaining.yaml#/paths/messageDeliveryGateway'
  /payments/stk:
    $ref: './remaining.yaml#/paths/stk'
  /payments/stk/{id}:
    $ref: './remaining.yaml#/paths/stkStatus'
  /reconciliation/queue:
    $ref: './remaining.yaml#/paths/queue'
  /reconciliation/queue/{id}/resolve:
    $ref: './remaining.yaml#/paths/resolution'
  /reconciliation/statements/preview:
    $ref: './remaining.yaml#/paths/statementPreview'
  /reconciliation/statements:
    $ref: './remaining.yaml#/paths/statements'
  /reconciliation/sponsors:
    $ref: './remaining.yaml#/paths/sponsor'
  /reconciliation/sponsors/{id}/refund:
    post:
      operationId: refundSponsorRemainder
      description: Bursar-only request reserving held suspense balance for independent refund approval and disbursement.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SponsorRefundInput' }
      responses:
        "200":
          description: Pending refund request
          content:
            application/json:
              schema: { $ref: './remaining.yaml#/components/schemas/CollectionRefundView' }
  /payment-plans:
    $ref: './remaining.yaml#/paths/plans'
  /payment-plans/{id}/decision:
    $ref: './remaining.yaml#/paths/planDecision'
  /notifications:
    $ref: './remaining.yaml#/paths/messages'
  /curriculum:
    $ref: './remaining.yaml#/paths/curriculum'
  /curriculum/seed:
    $ref: './remaining.yaml#/paths/curriculumSeed'
  /assessments:
    $ref: './remaining.yaml#/paths/assessments'
  /assessments/{id}/results:
    $ref: './remaining.yaml#/paths/results'
  /assessments/{id}/lock:
    $ref: './remaining.yaml#/paths/assessmentLock'
  /academics/ratings:
    $ref: './remaining.yaml#/paths/ratings'
  /report-cards:
    $ref: './remaining.yaml#/paths/reportCards'
  /report-cards/{id}/pdf:
    $ref: './remaining.yaml#/paths/reportCardPdf'
  /attendance:
    $ref: './remaining.yaml#/paths/attendance'
  /reports/{type}:
    $ref: './remaining.yaml#/paths/report'
  /reports/{type}/export:
    $ref: './remaining.yaml#/paths/reportExport'
  /bot/v1/identify:
    $ref: './remaining.yaml#/paths/botIdentify'
  /bot/v1/otp/request:
    $ref: './remaining.yaml#/paths/botOtpRequest'
  /bot/v1/otp/verify:
    $ref: './remaining.yaml#/paths/botOtpVerify'
  /reconciliation/refunds:
    $ref: './remaining.yaml#/paths/collectionRefunds'
  /reconciliation/refunds/{id}/decision:
    $ref: './remaining.yaml#/paths/collectionRefundDecision'
  /reconciliation/refunds/{id}/paid:
    $ref: './remaining.yaml#/paths/collectionRefundPaid'
  /reconciliation/sponsors/batches:
    $ref: './remaining.yaml#/paths/sponsorBatches'
  /reconciliation/sponsors/{id}/acknowledgement:
    $ref: './remaining.yaml#/paths/sponsorAcknowledgement'
  /curriculum/{kind}/{id}:
    $ref: './remaining.yaml#/paths/curriculumEdit'
  /report-cards/batch/pdf:
    $ref: './remaining.yaml#/paths/batchCards'
  /report-cards/{id}/send:
