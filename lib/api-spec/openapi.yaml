        licenceExpiresAt: { type: ["string", "null"], format: date-time }
        subscriptionStatus: { type: string, enum: [trial, active, expired, cancelled] }
        subscriptionStartDate: { type: ["string", "null"], format: date }
        subscriptionEndDate: { type: ["string", "null"], format: date }
        createdAt: { type: string, format: date-time }
      required: [id, name, code, type, status, createdAt]
    SetupStatus:
      type: object
      properties:
        needsSetup: { type: boolean }
        requiresSetupToken: { type: boolean }
      required: [needsSetup, requiresSetupToken]
