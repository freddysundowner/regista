components:
  schemas:
    StudentRemovalInput:
      type: object
      additionalProperties: false
      required: [confirmAdmissionNo]
      properties:
        confirmAdmissionNo: { type: string, minLength: 1 }
    StudentRemoval:
      type: object
      required: [mode, admissionNo, name, attendance, marks, ratings, reportCards, files, guardiansRemoved, guardiansKept, financeRecords]
      properties:
        mode: { type: string, enum: [delete, anonymize] }
        admissionNo: { type: string }
        name: { type: string }
        attendance: { type: integer }
        marks: { type: integer }
        ratings: { type: integer }
        reportCards: { type: integer }
        files: { type: integer }
        guardiansRemoved: { type: integer }
        guardiansKept: { type: integer }
        financeRecords: { type: integer }
    StaffProfile:
      type: object
      required: [user, assignments, stats, activity]
      properties:
        user: { $ref: "#/components/schemas/User" }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/StaffAssignment" }
        stats:
          type: object
          required: [classes, learners, subjects, attendanceMarked, registersMarked, assessments, actions, lastActivityAt]
          properties:
            classes: { type: integer }
            learners: { type: integer }
            subjects: { type: integer }
            attendanceMarked: { type: integer }
            registersMarked: { type: integer }
            assessments: { type: integer }
            actions: { type: integer }
            lastActivityAt: { type: string, format: date-time, nullable: true }
        activity:
          type: array
          items: { $ref: "#/components/schemas/AuditLog" }
    StaffAssignment:
      type: object
      required: [id, kind, recordId, userId, userName, userRole, userActive, gradeId, gradeName, streamId, streamName, subject, termName, isCurrentTerm, assignedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [class_teacher, stream_access, subject] }
        recordId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        userName: { type: string }
        userRole: { type: string }
        userActive: { type: boolean }
        gradeId: { type: string, format: uuid }
        gradeName: { type: string }
        streamId: { type: string, format: uuid }
        streamName: { type: string }
        subject: { type: string, nullable: true }
        termName: { type: string, nullable: true }
        isCurrentTerm: { type: boolean }
        assignedAt: { type: string, format: date-time }
    ClassSummary:
      type: object
      required: [kind, id, name, gradeId, gradeName, levelBand, streamName, classTeacher, teachers, learners, attendance, fees, students]
      properties:
        kind: { type: string, enum: [stream, grade] }
        id: { type: string, format: uuid }
        name: { type: string }
        gradeId: { type: string, format: uuid }
        gradeName: { type: string }
        levelBand: { type: string }
        streamName: { type: string, nullable: true }
        classTeacher:
          type: object
          nullable: true
          required: [id, name]
          properties: { id: { type: string, format: uuid }, name: { type: string } }
        teachers:
          type: array
          items:
            type: object
            required: [id, name, subjects]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              subjects: { type: array, items: { type: string } }
        learners:
          type: object
          required: [total, male, female, other, boarders, day, former]
          properties:
            total: { type: integer }
            male: { type: integer }
            female: { type: integer }
            other: { type: integer }
            boarders: { type: integer }
            day: { type: integer }
            former: { type: integer }
        attendance:
          type: object
          required: [days, records, percent, todayMarked, todayPresent, todayAbsent]
          properties:
            days: { type: integer }
            records: { type: integer }
            percent: { type: string, nullable: true }
            todayMarked: { type: integer }
            todayPresent: { type: integer }
            todayAbsent: { type: integer }
        fees:
          type: object
          nullable: true
          required: [outstanding, credit, owing]
          properties:
            outstanding: { type: string }
            credit: { type: string }
            owing: { type: integer }
        students:
          type: array
          items:
            type: object
            required: [id, admissionNo, fullName, gender, boardingStatus, balance, attendancePercent]
            properties:
              id: { type: string, format: uuid }
              admissionNo: { type: string }
              fullName: { type: string }
              gender: { type: string, nullable: true }
              boardingStatus: { type: string }
              balance: { type: string, nullable: true }
              attendancePercent: { type: string, nullable: true }
    WhatsappSetupState:
      type: object
      required: [platformKeyConfigured, hasOwnConnection, status, phoneNumber, businessName, displayName, error, connectionActive, inherited, legacyConfigured]
      properties:
        platformKeyConfigured: { type: boolean }
        hasOwnConnection: { type: boolean }
        status: { type: string }
        phoneNumber: { type: string }
        businessName: { type: string }
        displayName: { type: string }
        error: { type: string }
        requestId: { type: string }
        connectionActive: { type: boolean }
        inherited: { type: boolean }
        legacyConfigured: { type: boolean }
    LeadsIntelKeyInput:
      type: object
      required: [apiKey]
      properties:
        apiKey: { type: string, minLength: 10, maxLength: 4096 }
    WhatsappStartInput:
      type: object
      required: [countryCode, phoneNumber, businessName, displayName]
      properties:
        countryCode: { type: string, pattern: '^[1-9][0-9]{0,3}$' }
        phoneNumber: { type: string, pattern: '^[0-9]{4,14}$' }
        businessName: { type: string, minLength: 1, maxLength: 150 }
        displayName: { type: string, minLength: 1, maxLength: 150 }
    WhatsappRecoverInput:
      type: object
      required: [phoneNumber, confirmReceiverChange]
      properties:
        phoneNumber: { type: string, pattern: '^\+[1-9][0-9]{6,14}$' }
        confirmReceiverChange: { type: boolean }
    EmailAudienceRecipient:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        schoolName: { type: string }
        schoolId: { type: string }
    EmailQueuedResult:
      type: object
      required: [message]
      properties:
        id: { type: string }
        total: { type: integer }
        message: { type: string }
        messageId: { type: string }
    EmailCampaignCreateInput:
      type: object
      required: [idempotencyKey, kind, subject, html, recipients, consentConfirmed]
      properties:
        idempotencyKey: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/OutboundEmailKind" }
        subject: { type: string, minLength: 1, maxLength: 200 }
        html: { type: string, minLength: 1, maxLength: 100000 }
        recipients:
          type: array
          minItems: 1
          maxItems: 10000
          items: { type: string, format: email, maxLength: 254 }
        consentConfirmed: { type: boolean }
    OutboundEmailKind:
      type: string
      enum: [marketing, announcement, transactional]
    EmailCampaignSummary:
      type: object
      required: [id, kind, subject, createdAt, total, queued, accepted, failed, uncertain, skipped]
      properties:
        id: { type: string }
        kind: { type: string }
        subject: { type: string }
        createdAt: { type: string, format: date-time }
        total: { type: integer }
        queued: { type: integer }
        accepted: { type: integer }
        failed: { type: integer }
        uncertain: { type: integer }
        skipped: { type: integer }
    PlatformEmailTestInput:
      type: object
      required: [recipient]
      properties:
        recipient: { type: string, format: email, maxLength: 254 }
    PlatformEmailSettings:
      type: object
      required: [provider, enabled, configured, senderName, senderEmail, replyTo]
      properties:
        provider: { type: string, enum: [brevo] }
        enabled: { type: boolean }
        configured: { type: boolean }
        senderName: { type: string }
        senderEmail: { type: string }
        replyTo: { type: string }
        updatedAt: { type: string, format: date-time }
    PlatformEmailSettingsInput:
      type: object
      required: [enabled, senderName, senderEmail]
      properties:
        enabled: { type: boolean }
        senderName: { type: string, minLength: 1, maxLength: 100 }
        senderEmail: { type: string, format: email, maxLength: 254 }
        replyTo: { type: string, format: email, maxLength: 254 }
        apiKey:
          type: string
          minLength: 10
          maxLength: 4096
          writeOnly: true
          description: Omit to retain the saved encrypted key. Never returned in responses.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    MessageResponse:
      type: object
      properties:
        message: { type: string }
      required: [message]
    SchoolType:
      type: string
      enum: [primary, junior, senior, comprehensive, other]
    UserRole:
      type: string
      enum: [super_admin, school_admin, principal, bursar, teacher, class_teacher, storekeeper, librarian]
    StaffPermission:
      type: string
      description: Extra access a school admin can give one person on top of their role.
      enum: [expenses, procurement, approve_lpo, store, library]
    OnboardingStepId:
      type: string
      enum: [profile, calendar, classes, learners, staff, fees, invoices, collections, curriculum, parents]
