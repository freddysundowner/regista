        schoolCode: { type: string, minLength: 2, maxLength: 40 }
        county: { type: string, maxLength: 100 }
        schoolType: { $ref: "#/components/schemas/SchoolType" }
        adminName: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 9, maxLength: 20 }
        password: { type: string, minLength: 6, maxLength: 128 }
      required: [schoolName, schoolCode, schoolType, adminName, password]
    SchoolRegistrationInput:
      type: object
      additionalProperties: false
      required: [adminName, email, password]
      properties:
        schoolName: { type: string, minLength: 2, maxLength: 180, description: Optional; the school is named on the dashboard after sign-up. }
        schoolType: { $ref: "#/components/schemas/SchoolType" }
        adminName: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 180 }
        password: { type: string, minLength: 6, maxLength: 128 }
