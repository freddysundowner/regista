      type: object
      required: [available]
      properties:
        available: { type: boolean }
    SchoolRegistrationReview:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason: { type: string, minLength: 3, maxLength: 500 }
    LoginInput:
      type: object
      properties:
        identifier: { type: string, minLength: 3, maxLength: 180 }
        password: { type: string, minLength: 1, maxLength: 128 }
      required: [identifier, password]
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: ["string", "null"], format: uuid }
        lastLoginAt: { type: ["string", "null"], format: date-time }
        name: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        role: { $ref: "#/components/schemas/UserRole" }
        permissions: { type: array, items: { $ref: "#/components/schemas/StaffPermission" }, description: Extra access on top of the role }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, schoolId, name, role, permissions, isActive, createdAt]
    AuthSession:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
