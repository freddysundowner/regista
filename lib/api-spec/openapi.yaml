components:
  schemas:
    EmailAudienceRecipient:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        schoolName: { type: string }
    EmailQueuedResult:
      type: object
      required: [message]
      properties:
        id: { type: string }
        total: { type: integer }
        message: { type: string }
        messageId: { type: string }
    EmailCampaignCreateInput:
      type: object
      required: [idempotencyKey, kind, subject, html, recipients, consentConfirmed]
      properties:
        idempotencyKey: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/OutboundEmailKind" }
        subject: { type: string, minLength: 1, maxLength: 200 }
        html: { type: string, minLength: 1, maxLength: 100000 }
        recipients:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: email, maxLength: 254 }
        consentConfirmed: { type: boolean }
    OutboundEmailKind:
      type: string
      enum: [marketing, announcement, transactional]
    EmailCampaignSummary:
      type: object
      required: [id, kind, subject, createdAt, total, queued, accepted, failed, uncertain, skipped]
      properties:
        id: { type: string }
        kind: { type: string }
        subject: { type: string }
        createdAt: { type: string, format: date-time }
        total: { type: integer }
        queued: { type: integer }
        accepted: { type: integer }
        failed: { type: integer }
        uncertain: { type: integer }
        skipped: { type: integer }
    PlatformEmailTestInput:
      type: object
      required: [recipient]
      properties:
        recipient: { type: string, format: email, maxLength: 254 }
    PlatformEmailSettings:
      type: object
      required: [provider, enabled, configured, senderName, senderEmail, replyTo]
      properties:
        provider: { type: string, enum: [brevo] }
        enabled: { type: boolean }
        configured: { type: boolean }
        senderName: { type: string }
        senderEmail: { type: string }
        replyTo: { type: string }
        updatedAt: { type: string, format: date-time }
    PlatformEmailSettingsInput:
      type: object
      required: [enabled, senderName, senderEmail]
      properties:
        enabled: { type: boolean }
        senderName: { type: string, minLength: 1, maxLength: 100 }
        senderEmail: { type: string, format: email, maxLength: 254 }
        replyTo: { type: string, format: email, maxLength: 254 }
        apiKey:
          type: string
          minLength: 10
          maxLength: 4096
          writeOnly: true
          description: Omit to retain the saved encrypted key. Never returned in responses.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    MessageResponse:
      type: object
      properties:
        message: { type: string }
      required: [message]
    SchoolType:
      type: string
      enum: [primary, junior, senior, comprehensive, other]
    UserRole:
      type: string
      enum: [super_admin, school_admin, principal, bursar, teacher, class_teacher]
    StudentStatus:
      type: string
      enum: [active, transferred, graduated, left]
    LevelBand:
      type: string
      enum: [pre_primary, lower_primary, upper_primary, junior, senior, other]
    BoardingStatus:
      type: string
      enum: [day, boarder]
    School:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        county: { type: ["string", "null"] }
        type: { $ref: "#/components/schemas/SchoolType" }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        status: { type: string, enum: [active, suspended, pending, rejected] }
        registrationNote: { type: ["string", "null"] }
        logoUrl: { $ref: "#/components/schemas/AssetReference" }
        settings: { $ref: "#/components/schemas/SchoolSettings" }
        subscriptionPlan: { type: string }
        licenceManaged: { type: boolean }
        licenceStatus: { $ref: './licensing.yaml#/components/schemas/LicenceCoverageStatus' }
        licencePlanName: { type: ["string", "null"] }
        licenceExpiresAt: { type: ["string", "null"], format: date-time }
        subscriptionStatus: { type: string, enum: [trial, active, expired, cancelled] }
        subscriptionStartDate: { type: ["string", "null"], format: date }
        subscriptionEndDate: { type: ["string", "null"], format: date }
        createdAt: { type: string, format: date-time }
      required: [id, name, code, type, status, createdAt]
    SetupStatus:
      type: object
      properties:
        needsSetup: { type: boolean }
        requiresSetupToken: { type: boolean }
      required: [needsSetup, requiresSetupToken]
    InitialSetupInput:
      type: object
      properties:
        setupToken: { type: string, maxLength: 256 }
        schoolName: { type: string, minLength: 2, maxLength: 180 }
        schoolCode: { type: string, minLength: 2, maxLength: 40 }
        county: { type: string, maxLength: 100 }
        schoolType: { $ref: "#/components/schemas/SchoolType" }
        adminName: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 9, maxLength: 20 }
        password: { type: string, minLength: 10, maxLength: 128 }
      required: [schoolName, schoolCode, schoolType, adminName, password]
    SchoolRegistrationInput:
      type: object
      additionalProperties: false
      required: [schoolName, schoolType, adminName, email, password]
      properties:
        schoolName: { type: string, minLength: 2, maxLength: 180 }
        schoolType: { $ref: "#/components/schemas/SchoolType" }
        adminName: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 180 }
        password: { type: string, minLength: 10, maxLength: 128 }
    SchoolRegistrationReview:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
