      type: string
      enum: [active, transferred, graduated, left]
    LevelBand:
      type: string
      enum: [pre_primary, lower_primary, upper_primary, junior, senior, other]
    BoardingStatus:
      type: string
      enum: [day, boarder]
    School:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        county: { type: ["string", "null"] }
        type: { $ref: "#/components/schemas/SchoolType" }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        status: { type: string, enum: [active, suspended, pending, rejected] }
        registrationNote: { type: ["string", "null"] }
        logoUrl: { $ref: "#/components/schemas/AssetReference" }
        settings: { $ref: "#/components/schemas/SchoolSettings" }
        subscriptionPlan: { type: string }
        licenceManaged: { type: boolean }
