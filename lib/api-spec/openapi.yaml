        channel: { type: string, enum: [whatsapp, sms] }
        template: { type: string, minLength: 1, maxLength: 60 }
        content: { type: string, minLength: 5, maxLength: 1000 }
        gradeId: { type: string, format: uuid, description: Only this grade's parents. Left out, every parent. }
        idempotencyKey: { type: string, minLength: 8, maxLength: 80 }
    BroadcastResult:
      type: object
      required: [queued, skipped]
      properties:
        queued: { type: integer }
        skipped: { type: integer, description: Parents who could not be sent to on this channel (for WhatsApp, usually no open chat). }
    GeneratedDocument:
      type: object
