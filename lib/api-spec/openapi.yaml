          anyOf:
            - { $ref: "#/components/schemas/School" }
            - { type: "null" }
        mode: { type: string, enum: [platform, tenant, registration] }
        tenantAccess:
          anyOf:
            - { $ref: "#/components/schemas/TenantAccess" }
            - { type: "null" }
      required: [user, school, mode, tenantAccess]
    PlatformMessage:
      type: object
      properties:
        message: { type: string }
      required: [message]
