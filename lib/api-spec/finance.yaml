paths:
  update:
    get:
      operationId: getFinanceRecord
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: School-scoped direct finance record lookup
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceRecord' }
    patch:
      operationId: updateFinanceRecord
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinanceUpdateInput' }
      responses:
        '200':
          description: Fee item, sponsor or optional charge metadata updated; historical invoices unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceRecord' }
    delete:
      operationId: deleteFinanceRecord
      summary: Remove a fee item that nothing uses yet
      description: Only fee items can be removed, and only while no live fee structure, invoice line or active optional charge uses them. The item is archived, not erased, so history keeps it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Fee item archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceRecord' }
  records:
    get:
      operationId: listFinanceRecords
      parameters:
        - { name: kind, in: query, schema: { type: string } }
        - { name: studentId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: School-scoped records. Supply page for explicit pagination; omitting page preserves complete legacy arrays without truncation.
          headers:
            X-Total-Count:
              schema: { type: integer }
              description: Total matching records before pagination
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FinanceRecord' } }
    post:
      operationId: createFinanceRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinanceInput' }
      responses:
        '200':
          description: Created or idempotently returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceRecord' }
  decision:
    post:
      operationId: decideFinanceRecord
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinanceDecision' }
      responses:
        '200':
          description: Maker-checker decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceRecord' }
  preview:
    post:
      operationId: previewFinanceInvoices
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceBatchInput' }
      responses:
        '200':
          description: Proposed invoices, no financial writes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceBatchResult' }
  commit:
    post:
      operationId: commitFinanceInvoices
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceBatchInput' }
      responses:
        '200':
          description: Idempotent committed batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceBatchResult' }
  expenses:
    get:
      operationId: listExpenses
      summary: Money the school has spent
      parameters:
        - { name: from, in: query, description: 'First day, YYYY-MM-DD', schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: to, in: query, description: 'Last day, YYYY-MM-DD', schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        '200':
          description: Expenses, newest first, including voided ones
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Expense' } }
    post:
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '200':
          description: Expense recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
  expenseVoid:
    post:
      operationId: voidExpense
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseVoidInput' }
      responses:
        '200':
          description: Expense voided; it stays on record but leaves the totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
  promises:
    post:
      operationId: createPaymentPromise
      summary: Record a parent's promise to pay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentPromiseInput' }
      responses:
        '200':
          description: Promise recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentPromise' }
  promiseCancel:
    post:
      operationId: cancelPaymentPromise
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Promise cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentPromise' }
  summary:
    get:
      operationId: getFinanceSummary
      summary: Plain answers to the owner's money questions for a term
      parameters:
        - { name: termId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Expected, received, owed, spent, health, classes and adjustments for the term
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceSummary' }
  arrears:
    get:
      operationId: getFinanceArrears
      summary: Who owes, for the Money screen
      description: Every active learner with their balance, how old the unpaid amounts are (by term), last payment, plan and sponsor flags, primary parent and last fee reminder. Also counts active learners not yet billed for the current term.
      responses:
        '200':
          description: Arrears for the school
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArrearsView' }
  reminders:
    post:
      operationId: sendFeeReminders
      summary: Send a fee reminder to the primary parent of each chosen learner
      description: Skips learners who owe nothing or have no parent to reach. One reminder per learner per day for the same balance; repeating the request does not send twice.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeeReminderInput' }
      responses:
        '200':
          description: Reminders queued, and why any were skipped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeeReminderResult' }
  overview:
    get:
      operationId: getFinanceOverview
      responses:
        '200':
          description: Exact school totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceOverview' }
  history:
    get:
      operationId: getStudentFinanceHistory
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Student financial history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceHistory' }
  documents:
    post:
      operationId: createFinanceDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinanceDocumentInput' }
      responses:
        '200':
          description: Private PDF metadata and expiring link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceDocument' }
  download:
    get:
      operationId: downloadFinanceDocument
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
  jobs:
    get:
      operationId: listFailedFinanceJobs
      responses:
        '200':
          description: Failed background jobs
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
components:
  schemas:
    FinanceUpdateInput:
      type: object
      required: [reason]
      properties:
        name: { type: string, minLength: 1 }
        priority: { type: integer, minimum: 1 }
        contact: { type: string }
        endDate: { type: string, format: date }
        reason: { type: string, minLength: 1 }
    Money:
      type: string
      pattern: '^-?\d{1,12}(\.\d{1,2})?$'
      description: Exact KES decimal, never a JSON number.
    FinanceLineInput:
      type: object
      required: [feeItemId, amount]
      properties:
        feeItemId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        description: { type: string }
    FinanceInput:
      type: object
      required: [kind, idempotencyKey]
      properties:
        kind:
          type: string
          enum: [fee_item, fee_structure, optional_charge, sponsor, invoice, payment, adjustment, refund, refund_paid, reversal, cheque_status]
        idempotencyKey: { type: string, minLength: 1, maxLength: 150 }
        studentId: { type: string, format: uuid }
        termId: { type: string, format: uuid }
        parentId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        priority: { type: integer, minimum: 1 }
        isOptional: { type: boolean }
        academicYearId: { type: string, format: uuid }
        gradeId: { type: string, format: uuid }
        boardingStatus: { type: string, enum: [day, boarder] }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/FinanceLineInput' } }
        feeItemId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        reason: { type: string, minLength: 1 }
        reference: { type: string }
        sponsorId: { type: string, format: uuid }
        sponsorType: { type: string, enum: [ngcdf, county, ngo, church, individual, company, other] }
        contact: { type: string }
        adjustmentType: { type: string, enum: [discount, sibling_discount, waiver, bursary, sponsorship, write_off, correction] }
        recurring: { type: boolean }
        channel: { type: string, enum: [cash, cheque] }
        providerTxnId: { type: string, minLength: 1 }
        transactionTime: { type: string, format: date-time }
        payerName: { type: string }
        payerPhone: { type: string }
        chequeNo: { type: string }
        bank: { type: string }
        drawer: { type: string }
        chequeStatus: { type: string, enum: [banked, cleared, bounced] }
        method: { type: string }
    FinanceRecord:
      type: object
      required: [id, kind, status, amount, data, requestedBy, createdAt, uniqueKey]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        studentId: { type: [string, 'null'] }
        termId: { type: [string, 'null'] }
        parentId: { type: [string, 'null'] }
        status: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        data: { type: object, additionalProperties: true }
        uniqueKey: { type: string }
        requestedBy: { type: string }
        approvedBy: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    FinanceDecision:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        reason: { type: string, minLength: 1 }
    InvoiceBatchInput:
      type: object
      required: [termId, dueDate]
      properties:
        previewToken: { type: string, description: Required on commit; durable school-scoped exact preview identity. }
        termId: { type: string, format: uuid }
        gradeId: { type: string, format: uuid }
        dueDate: { type: string, format: date }
    InvoiceProposal:
      type: object
      required: [studentId, amount, lines, existing]
      properties:
        studentId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        lines: { type: array, items: { $ref: '#/components/schemas/FinanceLineInput' } }
        existing: { type: boolean }
        invoiceId: { type: string }
    InvoiceBatchResult:
      type: object
      required: [invoices]
      properties:
        previewToken: { type: string }
        invoices: { type: array, items: { $ref: '#/components/schemas/InvoiceProposal' } }
    ExpenseInput:
      type: object
      required: [date, category, description, amount, method]
      properties:
        date: { type: string, format: date }
        category: { type: string, enum: [salaries, statutory, food, transport, fuel, supplies, stationery, books, cleaning, uniforms, medical, exams, events, utilities, repairs, furniture, rent, bank_charges, other] }
        description: { type: string, minLength: 2, maxLength: 200 }
        amount: { type: string, pattern: '^\d{1,10}(\.\d{1,2})?$' }
        method: { type: string, enum: [cash, mpesa, bank, cheque] }
        payee: { type: string, maxLength: 120 }
        reference: { type: string, maxLength: 80 }
        supplierId: { type: string, format: uuid, description: The supplier paid; payee is filled from it }
        attachmentUrl: { type: string, maxLength: 120, description: 'Receipt scan: /api/storage/files/<id> from a finance_document upload' }
    ExpenseVoidInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 200 }
    Expense:
      type: object
      required: [id, date, category, description, amount, method, status, recordedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        category: { type: string }
        description: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        method: { type: string }
        payee: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        status: { type: string, enum: [active, voided] }
        voidReason: { type: string, nullable: true }
        supplierId: { type: string, format: uuid, nullable: true }
        supplierName: { type: string, nullable: true }
        supplierInvoiceId: { type: string, format: uuid, nullable: true }
        supplierInvoiceNo: { type: string, nullable: true }
        attachmentUrl: { type: string, nullable: true }
        recordedBy: { type: string, format: uuid }
        recordedByName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    PaymentPromiseInput:
      type: object
      required: [studentId, amount, promisedFor]
      properties:
        studentId: { type: string, format: uuid }
        amount: { type: string, pattern: '^\d{1,10}(\.\d{1,2})?$' }
        promisedFor: { type: string, format: date }
        note: { type: string, maxLength: 200 }
    PaymentPromise:
      type: object
      required: [id, studentId, amount, promisedFor, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        promisedFor: { type: string, format: date }
        note: { type: string, nullable: true }
        state: { type: string, enum: [due, kept, broken, cancelled], description: Worked out from payments made since the promise }
        createdAt: { type: string, format: date-time }
    MoneyLine:
      type: object
      required: [label, amount]
      properties:
        label: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
    ClassMoney:
      type: object
      required: [className, learners, billed, paid, owed, percentPaid]
      properties:
        className: { type: string }
        learners: { type: integer }
        billed: { $ref: '#/components/schemas/Money' }
        paid: { $ref: '#/components/schemas/Money' }
        owed: { $ref: '#/components/schemas/Money' }
        percentPaid: { type: integer }
    AdjustmentFlag:
      type: object
      required: [id, kind, amount, why, at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, description: discount, waiver, bursary, correction, reversal or refund }
        studentId: { type: string, format: uuid, nullable: true }
        studentName: { type: string, nullable: true }
        amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string, nullable: true }
        why: { type: string, description: Plain reason it is worth a look }
        requestedBy: { type: string, nullable: true }
        approvedBy: { type: string, nullable: true }
        status: { type: string, nullable: true }
        at: { type: string, format: date-time }
    FinanceSummary:
      type: object
      required: [termName, expected, received, owed, spent, health, classes, adjustments]
      properties:
        termId: { type: string, format: uuid, nullable: true }
        termName: { type: string, nullable: true }
        from: { type: string, format: date, nullable: true }
        to: { type: string, format: date, nullable: true }
        expected:
          type: object
          required: [billed, discounts, toCollect, paid, percentPaid, stillToCollect]
          properties:
            billed: { $ref: '#/components/schemas/Money' }
            discounts: { allOf: [{ $ref: '#/components/schemas/Money' }], description: Discounts, waivers and bursaries applied to this term's invoices }
            toCollect: { allOf: [{ $ref: '#/components/schemas/Money' }], description: Billed less discounts; the money that should come in }
            paid: { $ref: '#/components/schemas/Money' }
            percentPaid: { type: integer }
            stillToCollect: { $ref: '#/components/schemas/Money' }
        received:
          type: object
          required: [total, byChannel]
          properties:
            total: { $ref: '#/components/schemas/Money' }
            byChannel: { type: array, items: { $ref: '#/components/schemas/MoneyLine' } }
        owed:
          type: object
          required: [total, learners, fromPastTerms, promisesDue, promisesBroken, promisedAmount]
          properties:
            total: { $ref: '#/components/schemas/Money' }
            learners: { type: integer }
            fromPastTerms: { $ref: '#/components/schemas/Money' }
            promisesDue: { type: integer }
            promisesBroken: { type: integer }
            promisedAmount: { $ref: '#/components/schemas/Money' }
        spent:
          type: object
          required: [total, byCategory]
          properties:
            total: { $ref: '#/components/schemas/Money' }
            byCategory: { type: array, items: { $ref: '#/components/schemas/MoneyLine' } }
        health:
          type: object
          required: [received, spent, left, verdict]
          properties:
            received: { $ref: '#/components/schemas/Money' }
            spent: { $ref: '#/components/schemas/Money' }
            left: { type: string, description: Received minus spent; negative means more was spent than received }
            verdict: { type: string, enum: [healthy, tight, deficit, no_expenses] }
        classes: { type: array, items: { $ref: '#/components/schemas/ClassMoney' } }
        adjustments:
          type: object
          required: [discounts, discountsCount, reversals, refunds, flagged]
          properties:
            discounts: { $ref: '#/components/schemas/Money' }
            discountsCount: { type: integer }
            reversals: { type: integer }
            refunds: { $ref: '#/components/schemas/Money' }
            flagged: { type: array, items: { $ref: '#/components/schemas/AdjustmentFlag' } }
    ArrearsRow:
      type: object
      required: [studentId, admissionNo, studentName, balance, current, oneTerm, twoTerms, threePlusTerms, onPlan, sponsored, billedThisTerm]
      properties:
        studentId: { type: string, format: uuid }
        admissionNo: { type: string }
        studentName: { type: string }
        gradeName: { type: string, nullable: true }
        streamName: { type: string, nullable: true }
        balance: { $ref: '#/components/schemas/Money' }
        current: { $ref: '#/components/schemas/Money' }
        oneTerm: { $ref: '#/components/schemas/Money' }
        twoTerms: { $ref: '#/components/schemas/Money' }
        threePlusTerms: { $ref: '#/components/schemas/Money' }
        lastPaidAt: { type: string, format: date-time, nullable: true }
        lastPaidAmount: { type: string, nullable: true }
        onPlan: { type: boolean }
        sponsored: { type: boolean }
        billedThisTerm: { type: boolean }
        guardianName: { type: string, nullable: true }
        guardianPhone: { type: string, nullable: true }
        lastReminderAt: { type: string, format: date-time, nullable: true }
        promise: { allOf: [{ $ref: '#/components/schemas/PaymentPromise' }], nullable: true, description: The latest promise to pay, if any }
    ArrearsView:
      type: object
      required: [termName, rows, notBilled]
      properties:
        termName: { type: string, nullable: true }
        rows: { type: array, items: { $ref: '#/components/schemas/ArrearsRow' } }
        notBilled: { type: integer, description: Active learners with no invoice for the current term }
    FeeReminderInput:
      type: object
      required: [studentIds]
      properties:
        studentIds: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid } }
        channel: { type: string, enum: [whatsapp, sms], default: whatsapp }
    FeeReminderResult:
      type: object
      required: [queued, skipped]
      properties:
        queued: { type: integer }
        skipped:
          type: array
          items:
            type: object
            required: [studentId, reason]
            properties:
              studentId: { type: string, format: uuid }
              reason: { type: string }
    FinanceOverview:
      type: object
      required: [invoiced, collected, outstanding, credit, pendingApprovals, term, today]
      properties:
        term:
          description: The current term's billing and collections; null when no term is current.
          anyOf:
            - type: object
              required: [name, billed, discounts, collected, paid]
              properties:
                name: { type: string }
                billed: { $ref: '#/components/schemas/Money' }
                discounts:
                  description: Discounts, waivers and bursaries applied to this term's invoices; billed less this is what should come in.
                  allOf: [{ $ref: '#/components/schemas/Money' }]
                paid:
                  description: Money (not discounts) allocated to this term's invoices; excludes credit held for later.
                  allOf: [{ $ref: '#/components/schemas/Money' }]
                collected: { $ref: '#/components/schemas/Money' }
            - { type: "null" }
        today:
          type: object
          required: [total, channels]
          properties:
            total: { $ref: '#/components/schemas/Money' }
            channels:
              type: array
              items:
                type: object
                required: [channel, amount, count]
                properties:
                  channel: { type: string }
                  amount: { $ref: '#/components/schemas/Money' }
                  count: { type: integer }
        invoiced: { $ref: '#/components/schemas/Money' }
        collected: { $ref: '#/components/schemas/Money' }
        outstanding: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        pendingApprovals: { type: integer }
    FinanceHistory:
      type: object
      required: [balance, records, ledger, allocations]
      properties:
        balance: { $ref: '#/components/schemas/Money' }
        records: { type: array, items: { $ref: '#/components/schemas/FinanceRecord' } }
        ledger: { type: array, items: { type: object, additionalProperties: true } }
        allocations: { type: array, items: { type: object, additionalProperties: true } }
    FinanceDocumentInput:
      type: object
      required: [type, referenceId]
      properties:
        type: { type: string, enum: [receipt, statement, invoice] }
        referenceId: { type: string, format: uuid }
    FinanceDocument:
      type: object
      required: [id, downloadUrl, expiresAt]
      properties:
        id: { type: string }
        downloadUrl: { type: string }
        expiresAt: { type: string, format: date-time }