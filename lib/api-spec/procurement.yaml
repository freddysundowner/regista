paths:
  suppliers:
    get:
      operationId: listSuppliers
      summary: People and businesses the school buys from
      responses:
        '200':
          description: Suppliers by name, with what the school still owes each
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Supplier' } }
    post:
      operationId: createSupplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '200':
          description: Supplier added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
  supplier:
    delete:
      operationId: deleteSupplier
      summary: Remove a supplier that has no LPOs, invoices or payments
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Supplier removed
    patch:
      operationId: updateSupplier
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierUpdate' }
      responses:
        '200':
          description: Supplier updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
  orders:
    get:
      operationId: listPurchaseOrders
      summary: Local purchase orders (LPOs), newest first
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PurchaseOrderStatus' } }
        - { name: supplierId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Purchase orders
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PurchaseOrder' } }
    post:
      operationId: createPurchaseOrder
      summary: Raise an LPO; it waits for approval by someone else
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '200':
          description: LPO raised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
  order:
    get:
      operationId: getPurchaseOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One LPO with its lines, deliveries and invoices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
  orderDecision:
    post:
      operationId: decidePurchaseOrder
      summary: Approve or reject a pending LPO
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderDecision' }
      responses:
        '200':
          description: LPO decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
  orderCancel:
    post:
      operationId: cancelPurchaseOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcReasonInput' }
      responses:
        '200':
          description: LPO cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
  orderReceive:
    post:
      operationId: receivePurchaseOrder
      summary: Record goods delivered against an approved LPO; store items are topped up
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoodsReceiptInput' }
      responses:
        '200':
          description: Delivery recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
  invoices:
    get:
      operationId: listSupplierInvoices
      summary: Bills from suppliers, with what has been paid on each
      parameters:
        - { name: supplierId, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string, enum: [unpaid, paid, voided] } }
      responses:
        '200':
          description: Supplier invoices, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SupplierInvoice' } }
    post:
      operationId: createSupplierInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInvoiceInput' }
      responses:
        '200':
          description: Invoice recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierInvoice' }
  invoiceVoid:
    post:
      operationId: voidSupplierInvoice
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcReasonInput' }
      responses:
        '200':
          description: Invoice voided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierInvoice' }
  invoicePay:
    post:
      operationId: paySupplierInvoice
      summary: Pay all or part of a supplier invoice; records the payment as an expense
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierPaymentInput' }
      responses:
        '200':
          description: Payment recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierInvoice' }
components:
  schemas:
    ProcMoney:
      type: string
      pattern: '^-?\d{1,12}(\.\d{1,2})?$'
      description: Exact KES decimal, never a JSON number.
    ProcDay:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: A calendar day, YYYY-MM-DD.
    ProcReasonInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 200 }
    SupplierInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        contactPerson: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 20 }
        email: { type: string, maxLength: 160 }
        kraPin: { type: string, maxLength: 20 }
        address: { type: string, maxLength: 200 }
    SupplierUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        contactPerson: { type: [string, 'null'], maxLength: 120 }
        phone: { type: [string, 'null'], maxLength: 20 }
        email: { type: [string, 'null'], maxLength: 160 }
        kraPin: { type: [string, 'null'], maxLength: 20 }
        address: { type: [string, 'null'], maxLength: 200 }
        isActive: { type: boolean }
    Supplier:
      type: object
      required: [id, name, isActive, owed, openOrders, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        contactPerson: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        kraPin: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        isActive: { type: boolean }
        owed: { $ref: '#/components/schemas/ProcMoney' }
        openOrders: { type: integer }
        createdAt: { type: string, format: date-time }
    PurchaseOrderStatus:
      type: string
      enum: [pending, approved, rejected, partly_received, received, cancelled]
    PurchaseOrderLineInput:
      type: object
      required: [description, quantity, unitPrice]
      properties:
        storeItemId: { type: string, format: uuid, description: Store item this line tops up when received }
        description: { type: string, minLength: 1, maxLength: 200 }
        unit: { type: string, maxLength: 30 }
        quantity: { type: string, pattern: '^\d{1,8}(\.\d{1,2})?$' }
        unitPrice: { type: string, pattern: '^\d{1,10}(\.\d{1,2})?$' }
    PurchaseOrderInput:
      type: object
      required: [supplierId, date, lines]
      properties:
        supplierId: { type: string, format: uuid }
        date: { $ref: '#/components/schemas/ProcDay' }
        neededBy: { $ref: '#/components/schemas/ProcDay' }
        notes: { type: string, maxLength: 500 }
        lines: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/PurchaseOrderLineInput' } }
    PurchaseOrderDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: string, maxLength: 200 }
    PurchaseOrderLine:
      type: object
      required: [id, description, quantity, unitPrice, amount, receivedQty]
      properties:
        id: { type: string, format: uuid }
        storeItemId: { type: [string, 'null'], format: uuid }
        storeItemName: { type: [string, 'null'] }
        description: { type: string }
        unit: { type: [string, 'null'] }
        quantity: { type: string }
        unitPrice: { $ref: '#/components/schemas/ProcMoney' }
        amount: { $ref: '#/components/schemas/ProcMoney' }
        receivedQty: { type: string }
    GoodsReceipt:
      type: object
      required: [id, date, lines, receivedByName, createdAt]
      properties:
        id: { type: string, format: uuid }
        date: { type: string }
        deliveryNote: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        receivedByName: { type: [string, 'null'] }
        lines:
          type: array
          items:
            type: object
            required: [lineId, description, quantity]
            properties:
              lineId: { type: string, format: uuid }
              description: { type: string }
              quantity: { type: string }
        createdAt: { type: string, format: date-time }
    PurchaseOrder:
      type: object
      required: [id, number, reference, supplierId, supplierName, date, status, total, invoiced, createdBy, createdAt, lines, receipts]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        reference: { type: string, description: 'Printed LPO number, e.g. LPO-0007' }
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        date: { type: string }
        neededBy: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/PurchaseOrderStatus' }
        total: { $ref: '#/components/schemas/ProcMoney' }
        invoiced: { $ref: '#/components/schemas/ProcMoney' }
        createdBy: { type: string, format: uuid }
        createdByName: { type: [string, 'null'] }
        decidedByName: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionNote: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lines: { type: array, items: { $ref: '#/components/schemas/PurchaseOrderLine' } }
        receipts: { type: array, items: { $ref: '#/components/schemas/GoodsReceipt' } }
    GoodsReceiptInput:
      type: object
      required: [date, lines]
      properties:
        date: { $ref: '#/components/schemas/ProcDay' }
        deliveryNote: { type: string, maxLength: 60 }
        note: { type: string, maxLength: 200 }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [lineId, quantity]
            properties:
              lineId: { type: string, format: uuid }
              quantity: { type: string, pattern: '^\d{1,8}(\.\d{1,2})?$' }
    SupplierInvoiceInput:
      type: object
      required: [supplierId, invoiceNo, date, description, category, amount]
      properties:
        supplierId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        invoiceNo: { type: string, minLength: 1, maxLength: 60 }
        date: { $ref: '#/components/schemas/ProcDay' }
        dueDate: { $ref: '#/components/schemas/ProcDay' }
        description: { type: string, minLength: 2, maxLength: 200 }
        category: { type: string, minLength: 2, maxLength: 40 }
        amount: { type: string, pattern: '^\d{1,10}(\.\d{1,2})?$' }
        attachmentUrl: { type: string, maxLength: 120 }
    SupplierInvoice:
      type: object
      required: [id, supplierId, supplierName, invoiceNo, date, description, category, amount, paid, balance, status, state, createdAt, payments]
      properties:
        id: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        orderId: { type: [string, 'null'], format: uuid }
        orderReference: { type: [string, 'null'] }
        invoiceNo: { type: string }
        date: { type: string }
        dueDate: { type: [string, 'null'] }
        description: { type: string }
        category: { type: string }
        amount: { $ref: '#/components/schemas/ProcMoney' }
        paid: { $ref: '#/components/schemas/ProcMoney' }
        balance: { $ref: '#/components/schemas/ProcMoney' }
        attachmentUrl: { type: [string, 'null'] }
        status: { type: string, enum: [active, voided] }
        state: { type: string, enum: [unpaid, part_paid, paid, overdue, voided], description: Worked out from payments and the due date }
        voidReason: { type: [string, 'null'] }
        createdByName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        payments:
          type: array
          items:
            type: object
            required: [expenseId, date, amount, method, status]
            properties:
              expenseId: { type: string, format: uuid }
              date: { type: string }
              amount: { $ref: '#/components/schemas/ProcMoney' }
              method: { type: string }
              reference: { type: [string, 'null'] }
              status: { type: string }
    SupplierPaymentInput:
      type: object
      required: [date, amount, method]
      properties:
        date: { $ref: '#/components/schemas/ProcDay' }
        amount: { type: string, pattern: '^\d{1,10}(\.\d{1,2})?$' }
        method: { type: string, enum: [cash, mpesa, bank, cheque] }
        reference: { type: string, maxLength: 80 }
        attachmentUrl: { type: string, maxLength: 120 }
